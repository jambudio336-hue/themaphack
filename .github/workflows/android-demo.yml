name: Android Safe Demo Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "demo-v*"
    paths:
      - "safe-demo/**"
      - ".github/workflows/android-demo.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safe-demo
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-demo-apk
          path: safe-demo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish demo release for version tag
        if: startsWith(github.ref, 'refs/tags/demo-v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Native UI Demo ${{ github.ref_name }}"
          generate_release_notes: true
          files: safe-demo/app/build/outputs/apk/debug/app-debug.apk
